spring.application.name=ECommerceBackend

# PRIMA ERA: jdbc:h2:mem:testdb (RAM)
# ADESSO: salva su file nella cartella 'data' del progetto
spring.datasource.url=jdbc:h2:file:./data/ecommerceDB

spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# update = crea le tabelle se mancano, ma NON cancella i dati esistenti
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console H2 sempre disponibile
spring.h2.console.enabled=true

# JWT: chiave di firma HS256 (in produzione andrebbe letta da una variabile
# d'ambiente / secret manager, non committata) e durata del token.
jwt.secret=3/JqrvB6Xi+M1L9Q8WUNFjqkbgAHglf2i8Zt9OtGtbDsdJUnvskKLFSILfGu4V5/
jwt.expiration-ms=86400000

# Origini ammesse dalla CORS policy (frontend React in sviluppo).
cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
